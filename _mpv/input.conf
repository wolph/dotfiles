# mpv keybindings
#
# The default bindings are hardcoded into the mpv binary; this file only adds
# to them. Run mpv --input-test --force-window --idle to see what a key is
# bound to, and see https://mpv.io/manual/stable/#list-of-input-commands for
# the commands.

ctrl+r cycle-values video-rotate 90 180 270 0
ctrl+R cycle-values video-rotate 270 180 90 0
