# mpv configuration file
#
# Only the settings that actually deviate from the defaults live here. Run
# mpv --list-options to see the default value of every option, and see
# https://mpv.io/manual/stable/ for what they do. Profiles go at the bottom:
# everything below a [section] header belongs to that profile.

##########
# Window #
##########

ontop=yes
title="${media-title} :: ${path}"
native-fs=no                   # macOS: mpv's own fullscreen, not a new Space
cursor-autohide=10000          # hide the cursor after 10 seconds...
cursor-autohide-fs-only=yes    # ...but only while fullscreen

#########
# Video #
#########

hwdec=auto-copy

#############
# Subtitles #
#############

blend-subtitles=yes
sub-margin-y=50                # keep subtitles clear of the OSC bar

#########
# Audio #
#########

volume-max=200

############
# Playback #
############

hr-seek=absolute               # much faster, at the cost of some precision
hr-seek-framedrop=yes
use-filedir-conf=yes           # honour an mpv.conf next to the files
reset-on-next-file=audio-delay,pause,speed,sub-delay,video-aspect-override,video-pan-x,video-pan-y,video-rotate,video-zoom

#########
# Cache #
#########

cache=yes
cache-secs=1800
cache-pause=no                 # keep playing when the cache runs low
demuxer-max-bytes=1610612736
demuxer-max-back-bytes=1610612736

##########
# Output #
##########

osd-font="Helvetica Neue"
msg-color=yes                  # colour log messages on the terminal
term-osd-bar=yes               # progress bar on the terminal
msg-level=streamcache=error
quiet=yes

# Pretend to be a web browser. Fixes playback on some streaming sites, breaks
# shoutcast streams.
user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/62.0.3202.94 Safari/537.36"

############
# Profiles #
############

[sd]
profile-desc=sd
# width and height are nil while idle and on audio-only files, so guard the
# comparison: auto_profiles logs an error on every failed evaluation.
profile-cond=width ~= nil and height ~= nil and (width < 1280 or height < 720)
# glsl-shader="~~/shaders/FSRCNNX_x2_16-0-4-1.glsl"
# glsl-shader="~~/shaders/FSRCNNX_x2_8-0-4-1.glsl"

###################################
# Protocol specific configuration #
###################################

[protocol.http]
hls-bitrate=max                # use max quality for HLS streams
cache=yes
no-cache-pause

[protocol.https]
profile=protocol.http

[protocol.ytdl]
profile=protocol.http
